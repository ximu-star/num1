<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>掌柜智库</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --brand: #38bdf8;
            --brand2: #818cf8;
            --bubble-user: linear-gradient(135deg, #38bdf8, #818cf8);
            --bubble-bot: #f1f5f9;
            --border: #e2e8f0;
            --shadow: 0 8px 30px -12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.06) 0%, transparent 50%),
            radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.06) 0%, transparent 50%);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        .app {
            width: 100%;
            max-width: 980px;
            height: min(820px, 92vh);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: #ffffff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 240px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .title {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .title strong {
            font-size: 14px
        }

        .title span {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 999px;
            background: #f8fafc;
        }

        .btn {
            border: none;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .chat {
            flex: 1;
            overflow: auto;
            padding: 16px 14px 10px;
            background: #f8fafc;
        }

        .dayline {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 6px 0 14px;
        }

        .msg {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            align-items: flex-end;
        }

        .msg.user {
            justify-content: flex-end
        }

        /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
        .msg > div:not(.avatar) {
            flex: 1;
            min-width: 0;
        }

        .msg.user > div:not(.avatar) {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0369a1;
            flex: 0 0 auto;
        }

        .avatar.bot {
            background: linear-gradient(135deg, #e0f7ff, #ede9fe);
        }

        .bubble {
            max-width: min(720px, 76%);
            display: inline-block;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: var(--bubble-bot);
            position: relative;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            color: #1e293b;
        }

        .msg.user .bubble {
            background: var(--bubble-user);
            color: #fff;
            border-color: transparent;
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
        }

        .msg.user .meta {
            color: rgba(255, 255, 255, .85)
        }

        details.progress {
            margin-top: 8px;
            border: 1px dashed rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 8px 10px;
            background: #ffffff;
        }

        details.progress summary {
            cursor: pointer;
            user-select: none;
            color: #334155;
            font-size: 12px;
        }

        .progress ul {
            margin: 8px 0 0 18px;
            padding: 0
        }

        .progress li {
            margin: 4px 0;
            font-size: 12px;
            color: #475569
        }

        .answer {
            margin-top: 12px;
        }

        .answer-text {
            white-space: pre-wrap;
        }

        .answer-images {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer-images img {
            display: block;
            max-width: min(100%, 600px);
            max-height: 600px;
            width: auto;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
            background: #ffffff;
        }

        .answer-images a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            word-break: break-all;
        }

        .typing {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: .15s
        }

        .dot:nth-child(3) {
            animation-delay: .3s
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .6
            }
            40% {
                transform: translateY(-5px);
                opacity: 1
            }
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #ffffff;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            line-height: 1.5;
            background: #f8fafc;
            color: #1e293b;
        }

        textarea:focus {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15)
        }

        textarea::placeholder {
            color: #94a3b8
        }

        .send {
            width: 88px;
            height: 44px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        .send:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .hint {
            padding: 0 14px 12px;
            color: var(--muted);
            font-size: 12px;
            background: transparent;
        }

        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 6px;
            background: #f1f5f9;
            color: #475569;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2.5" y="4" width="19" height="16" rx="3" fill="white"/>
                    <circle cx="12" cy="1.8" r="1.4" fill="white"/>
                    <rect x="11.6" y="1.8" width="0.8" height="2.2" fill="white"/>
                    <circle cx="8" cy="10" r="1.3" fill="#38bdf8"/>
                    <circle cx="16" cy="10" r="1.3" fill="#38bdf8"/>
                    <rect x="7.2" y="14.2" width="9.6" height="1.6" rx="0.8" fill="#38bdf8"/>
                </svg>
            </div>
            <div class="title">
                <strong>掌柜智库</strong>
                <span id="subTitle">在线 · 可查询知识库与联网信息</span>
            </div>
        </div>
        <div class="top-actions">
            <span class="pill" id="apiPill">API: 未连接</span>
            <button class="btn" id="btnClear">清空对话</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
            <div class="avatar bot">🤖</div>
            <div>
                <div class="bubble">
                    <details class="progress">
                        <summary>阶段进度</summary>
                        <ul></ul>
                    </details>
                    <div class="answer">
                        <div class="answer-text">你好，我是掌柜智库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
                    </div>
                </div>
                <div class="meta">提示：可以问“如何使用万用表测量电压？”</div>
            </div>
        </div>
    </div>

    <div class="composer">
        <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span
            class="kbd">Enter</span> 换行
    </div>
</div>

<script>
    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    const API_BASE = 'http://127.0.0.1:8001'
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const apiPill = document.getElementById('apiPill');

    // 创建会话: 从localStorage获取sessionId
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
        sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function formatTime(ts) {
        if (!ts) return nowTime();
        const d = new Date(Number(ts) * 1000);
        if (Number.isNaN(d.getTime())) return nowTime();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", "&#039;");
    }

    function isImageUrl(url) {
        try {
            const u = new URL(url);
            return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
        } catch (e) {
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
        }
    }

    function normalizeUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
        const seen = new Set();
        const out = [];
        for (const x of (Array.isArray(arr) ? arr : [])) {
            const v = String(x || '');
            if (!v) continue;
            if (seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    function extractUrlsLoose(text) {
        const s = String(text || '');
        const regex = /(https?:\/\/[^\s]+)/g;
        const matches = s.match(regex) || [];
        const urls = [];

        const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
        const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

        for (const m of matches) {
            let u = trimHeadPunct(trimTailPunct(m));
            if (u) urls.push(u);
        }
        return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw) {
        const s = String(raw || '');
        const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
        let m;
        let lastIdx = -1;
        let lastLen = 0;
        while ((m = re.exec(s)) !== null) {
            lastIdx = m.index;
            lastLen = m[0].length;
        }
        return {idx: lastIdx, len: lastLen};
    }

    function parseAnswerAndImages(text) {
        const raw = String(text || '');
        const {idx, len} = findLastImageMarkerIndex(raw);
        if (idx === -1) return {text: raw, images: []};

        const before = raw.slice(0, idx).trimEnd();
        const after = raw.slice(idx + len).trim();
        const urls = [];

        const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                urls.push(line);
            } else {
                const matches = extractUrlsLoose(line);
                for (const u of matches) {
                    urls.push(u);
                }
            }
        }

        const seen = new Set();
        const images = [];
        for (const u of urls) {
            const normalized = normalizeUrl(u);
            if (!isImageUrl(normalized)) continue;
            if (seen.has(normalized)) continue;
            seen.add(normalized);
            images.push(normalized);
        }
        return {text: before, images};
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
        const {text, images: imagesFromBlock} = parseAnswerAndImages(answerText);
        const candidates = Array.isArray(candidateImageUrls)
            ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
            : [];
        const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

        const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

        const allImages = new Set([
            ...(hasBlockImages ? imagesFromBlock : []),
            ...candidates,
            ...looseImages
        ]);
        const images = Array.from(allImages);

        containerEl.textContent = '';

        if ((text || '').trim().length > 0) {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = text;
            containerEl.appendChild(textEl);
        } else {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = '（已完成，但未返回答案）';
            containerEl.appendChild(textEl);
        }

        if (images && images.length > 0) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'answer-images';
            for (const url of images) {
                const safeUrl = normalizeUrl(url);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = safeUrl;
                img.alt = '参考图片';
                img.referrerPolicy = 'no-referrer';
                img.addEventListener('error', () => {
                    img.style.display = 'none';
                });
                imgWrap.appendChild(img);

                const link = document.createElement('a');
                link.href = safeUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = url;
                imgWrap.appendChild(link);
            }
            containerEl.appendChild(imgWrap);
        }
    }

    function addUserMsg(text) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addUserMsgWithTime(text, ts) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
        const id = 'bot-his-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div>
            <div class="bubble">
              <details class="progress">
                <summary>阶段进度</summary>
                <ul></ul>
              </details>
              <div class="answer"></div>
            </div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        if (el) {
            const answerEl = el.querySelector('.answer');
            renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        }
        scrollToBottom();
    }

    function addBotMsgSkeleton() {
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
              <div class="answer"></div>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status) {
        const details = botMsgEl.querySelector('details.progress');
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const totalDone = done.length;
        const totalRun = running.length;

        const statusMap = {
            'processing': '处理中',
            'completed': '已完成',
            'failed': '失败',
            'pending': '等待中',
        };
        const displayStatus = statusMap[status] || status || 'unknown';

        summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

        const lines = [
            ...done.map(x => `✅ ${x}`),
            ...running.map(x => `⏳ ${x}`)
        ];
        ul.innerHTML = '';
        if (lines.length === 0) {
            ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
        } else {
            for (const line of lines) {
                ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
            }
        }
    }

    async function apiHealth() {
        try {
            const res = await fetch(`${API_BASE}/health`);
            if (!res.ok) throw new Error('health not ok');
            apiPill.textContent = `API: 已连接`;
        } catch (e) {
            apiPill.textContent = `API: 未连接`;
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length === 0) return;
            const nodes = Array.from(chatEl.querySelectorAll('.msg'));
            for (let i = 1; i < nodes.length; i++) nodes[i].remove();
            for (const item of items) {
                if (item.role === 'user') {
                    addUserMsgWithTime(item.text || '', item.ts);
                } else {
                    addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
                }
            }
            scrollToBottom();
        } catch (_) {
        }
    }

    async function submitQuery(text) {
        const res = await fetch(`${API_BASE}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                query: text,
                session_id: sessionId
            })
        });
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || '请求失败');
        }
        return await res.json();
    }

    async function onSend() {
        const text = (inputEl.value || '').trim();
        if (!text) return;
        inputEl.value = '';
        addUserMsg(text);
        const botMsgEl = addBotMsgSkeleton();
        sendBtn.disabled = true;

        try {
            const data = await submitQuery(text);

            renderProgress(botMsgEl, [], [], 'pending');

            const {task_id} = data;

            const bubble = botMsgEl.querySelector('.bubble');
            const answerEl = bubble.querySelector('.answer');
            let rawAnswerText = '';

            const es = new EventSource(`${API_BASE}/stream/${task_id}`);

            es.addEventListener('progress', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
                    if (d && d.status === 'completed') {
                        const typing = botMsgEl.querySelector('.typing');
                        if (typing) typing.remove();
                        sendBtn.disabled = false;
                    }
                } catch (_) {
                }
            });

            es.addEventListener('delta', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if (delta) {
                        rawAnswerText += delta;
                        renderAnswerWithImages(answerEl, rawAnswerText, []);
                        scrollToBottom();
                    }
                } catch (_) {
                }
            });

            es.addEventListener('final', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();

                const details = botMsgEl.querySelector('details.progress');
                if (details) {
                    const ul = details.querySelector('ul');
                    if (ul) {
                        const lis = ul.querySelectorAll('li');
                        lis.forEach(li => {
                            if (li.textContent.includes('⏳')) {
                                li.textContent = li.textContent.replace('⏳', '✅');
                            }
                        });
                    }
                    const summary = details.querySelector('summary');
                    if (summary) {
                        const totalDone = details.querySelectorAll('li').length;
                        summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
                    }
                    details.removeAttribute('open');
                }

                try {
                    const d = JSON.parse(e.data || '{}');
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
                    renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
                } catch (_) {
                }
                es.close();
                sendBtn.disabled = false;
            });

            es.addEventListener('error', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();
                const progress = botMsgEl.querySelector('details.progress');
                if (progress) progress.removeAttribute('open');

                try {
                    const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
                    rawAnswerText += `\n\n（错误：${msg}）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                } catch (_) {
                    rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                }
                es.close();
                sendBtn.disabled = false;
            });
        } catch (e) {
            const bubble = botMsgEl.querySelector('.bubble');
            const progress = botMsgEl.querySelector('details.progress');
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            onSend();
        }
    });
    btnClear.addEventListener('click', async () => {
        if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`, {method: 'DELETE'});
            if (!res.ok) {
                console.error("Failed to clear history backend, status:", res.status);
                alert('服务端清空失败，仅清空本地显示');
            }
        } catch (e) {
            console.error("Failed to clear history backend", e);
            alert('服务端清空失败，仅清空本地显示');
        }

        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        scrollToBottom();
    });

    apiHealth();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>
</body>
</html>
